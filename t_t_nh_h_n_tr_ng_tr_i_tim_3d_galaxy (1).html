<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Hân Trương ❤️ | Lời Tỏ Tình Từ Trái Tim</title>

    <!-- Google Fonts: Poppins & Pacifico -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Three.js Library for 3D Particle Heart -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        /* Fullscreen WebGL Canvas */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 2D Overlay Canvas for Floating Hearts & Fireworks */
        #overlay-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Flash Screen Overlay Effect */
        #flash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* UI Main Container */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        /* Header Style */
        .app-header {
            width: 100%;
            max-width: 680px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(15, 15, 30, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            margin-top: 10px;
            pointer-events: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a5b4fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .song-tag {
            font-size: 0.75rem;
            color: #f472b6;
            background: rgba(244, 114, 182, 0.15);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(244, 114, 182, 0.3);
            margin-left: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: rgba(244, 114, 182, 0.3);
            border-color: #f472b6;
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.5);
        }

        .btn-upload {
            background: rgba(139, 92, 246, 0.25);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .btn-upload:hover {
            background: rgba(139, 92, 246, 0.5);
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a5b4fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .song-tag {
            font-size: 0.75rem;
            color: #f472b6;
            background: rgba(244, 114, 182, 0.15);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(244, 114, 182, 0.3);
            margin-left: 6px;
        }

        .music-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: rgba(244, 114, 182, 0.3);
            border-color: #f472b6;
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.5);
        }

        /* Main Dialogue Box (Glassmorphism) */
        .dialogue-card {
            pointer-events: auto;
            width: 90%;
            max-width: 520px;
            background: rgba(10, 10, 25, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            margin: auto;
            transform: translateY(0);
            animation: floatCard 4s ease-in-out infinite;
            transition: all 0.5s ease;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Typewriter Text Styling */
        .typewriter-box {
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin-bottom: 24px;
        }

        .typewriter-text {
            font-size: 1.15rem;
            line-height: 1.7;
            font-weight: 400;
            color: #e2e8f0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .highlight-name {
            font-family: 'Pacifico', cursive;
            color: #f472b6;
            font-size: 1.6rem;
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.8);
            display: inline-block;
            margin: 0 4px;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2rem;
            background-color: #f472b6;
            margin-left: 4px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Action Buttons Area */
        .buttons-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            position: relative;
            min-height: 56px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .buttons-group.show {
            opacity: 1;
            pointer-events: auto;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            white-space: nowrap;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4),
                        0 0 20px rgba(139, 92, 246, 0.3);
        }

        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.7),
                        0 0 30px rgba(139, 92, 246, 0.6);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            transition: left 0.2s ease, top 0.2s ease;
        }

        /* Final Success Box Message */
        .success-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .success-title {
            font-family: 'Pacifico', cursive;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f472b6, #fb7185, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(244, 114, 182, 0.8);
        }

        .success-sub {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Footer Note */
        .footer-note {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
            text-align: center;
            pointer-events: auto;
        }

        /* Responsive Mobile Layout Adjustments */
        @media (max-width: 480px) {
            .dialogue-card {
                padding: 24px 20px;
                border-radius: 22px;
            }

            .typewriter-text {
                font-size: 1rem;
            }

            .highlight-name {
                font-size: 1.35rem;
            }

            .buttons-group {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                padding: 12px 20px;
            }

            .success-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- WebGL Canvas for Three.js 3D Heart -->
    <canvas id="webgl-canvas"></canvas>

    <!-- 2D Canvas for Ambient Floating Hearts & Fireworks -->
    <canvas id="overlay-canvas"></canvas>

    <!-- Flash Effect Screen -->
    <div id="flash-screen"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-container">
        <!-- Top Navigation Header -->
        <header class="app-header">
            <div class="header-title">
                <i class="fa-solid fa-heart text-pink-400"></i>
                <span>Gửi Hân Trương</span>
                <span class="song-tag"><i class="fa-solid fa-music"></i> Anh Thề Đấy</span>
            </div>
            <div class="header-actions">
                <!-- Direct Local File Upload for Download.mp3 -->
                <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
                <button id="uploadMusicBtn" class="music-btn btn-upload" title="Chọn file Download.mp3 từ máy của bạn">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>Chọn File MP3</span>
                </button>

                <button id="musicBtn" class="music-btn">
                    <i id="musicIcon" class="fa-solid fa-music"></i>
                    <span id="musicText">Phát Nhạc</span>
                </button>
            </div>
        </header>

        <!-- Main Dialogue Display Card -->
        <main id="mainCard" class="dialogue-card">
            <!-- Typewriter Container -->
            <div id="typewriterContainer" class="typewriter-box">
                <p id="typewriterText" class="typewriter-text"></p>
            </div>

            <!-- Interactive Buttons (Yes / Runaway No) -->
            <div id="buttonsGroup" class="buttons-group">
                <button id="btnYes" class="btn btn-yes">
                    <span>💖 Đồng ý</span>
                </button>
                <button id="btnNo" class="btn btn-no">
                    <span>💔 Để em suy nghĩ</span>
                </button>
            </div>

            <!-- Success Celebration Message -->
            <div id="successBox" class="success-box">
                <div style="font-size: 3rem; margin-bottom: -5px;">🥰✨</div>
                <h2 class="success-title">Yêu em rất nhiều ❤️</h2>
                <p class="success-sub">Cảm ơn Hân Trương vì đã bước vào cuộc đời anh!<br>Hành trình hạnh phúc của chúng mình chính thức bắt đầu!</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer-note">
            ✨ Được tạo với trọn vẹn tình yêu dành riêng cho Hân Trương ✨
        </footer>
    </div>

    <script>
        /* 
         * CONFESSION APPLICATION FOR HÂN TRƯƠNG
         * High Performance Three.js 3D Particle Heart Engine
         */

        // 1. CONFIGURATION & MUSIC SETUP
        // Ca khúc: "Anh Thề Đấy" - Thanh Hưng
        const BG_MUSIC_URL = "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3";
        
        let audio = new Audio(BG_MUSIC_URL);
        audio.loop = true;
        let isMusicPlaying = false;

        const musicBtn = document.getElementById('musicBtn');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');
        const uploadMusicBtn = document.getElementById('uploadMusicBtn');
        const audioFileInput = document.getElementById('audioFileInput');

        // Bấm nút "Chọn File MP3" để nạp file Download.mp3 của bài Anh Thề Đấy
        uploadMusicBtn.addEventListener('click', () => {
            audioFileInput.click();
        });

        audioFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const localAudioUrl = URL.createObjectURL(file);
                audio.src = localAudioUrl;
                audio.play().then(() => {
                    musicIcon.className = "fa-solid fa-compact-disc fa-spin";
                    musicText.innerText = "Tắt Nhạc";
                    isMusicPlaying = true;
                }).catch((err) => {
                    console.log("Audio play error:", err);
                });
            }
        });

        function toggleMusic() {
            if (isMusicPlaying) {
                audio.pause();
                musicIcon.className = "fa-solid fa-music";
                musicText.innerText = "Phát Nhạc";
                isMusicPlaying = false;
            } else {
                audio.play().then(() => {
                    musicIcon.className = "fa-solid fa-compact-disc fa-spin";
                    musicText.innerText = "Tắt Nhạc";
                    isMusicPlaying = true;
                }).catch(() => {
                    console.log("Autoplay prevented by browser.");
                });
            }
        }

        musicBtn.addEventListener('click', toggleMusic);

        // Auto start music on first user click anywhere on screen
        window.addEventListener('click', function autoPlayOnce() {
            if (!isMusicPlaying) {
                toggleMusic();
            }
            window.removeEventListener('click', autoPlayOnce);
        }, { once: true });


        // 2. THREE.JS 3D PARTICLE HEART ENGINE
        const canvas3D = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 180;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Create Glowing Circular Particle Texture
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(244,114,182,0.8)');
            gradient.addColorStop(0.7, 'rgba(139,92,246,0.3)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const particleTexture = createParticleTexture();

        // Generate 3D Heart Geometry Particles
        const HEART_PARTICLE_COUNT = 4500;
        const heartGeometry = new THREE.BufferGeometry();
        const heartPositions = new Float32Array(HEART_PARTICLE_COUNT * 3);
        const heartColors = new Float32Array(HEART_PARTICLE_COUNT * 3);
        const heartOriginals = [];

        // Parametric 3D Heart Function
        function getHeartPoint(t, u) {
            // Heart parametric math formulas
            const sinT = Math.sin(t);
            const x = 16 * Math.pow(sinT, 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            const z = u * (Math.sin(t) * 6);
            return { x: x * 3.2, y: y * 3.2, z: z * 3.2 };
        }

        const colorPink = new THREE.Color('#f472b6');
        const colorPurple = new THREE.Color('#8b5cf6');
        const colorCyan = new THREE.Color('#38bdf8');

        for (let i = 0; i < HEART_PARTICLE_COUNT; i++) {
            const t = Math.random() * Math.PI * 2;
            const u = (Math.random() - 0.5) * 2;

            const pt = getHeartPoint(t, u);

            // Slight random volumetric dispersion
            const jitter = 1.8;
            pt.x += (Math.random() - 0.5) * jitter;
            pt.y += (Math.random() - 0.5) * jitter;
            pt.z += (Math.random() - 0.5) * jitter;

            heartPositions[i * 3] = pt.x;
            heartPositions[i * 3 + 1] = pt.y;
            heartPositions[i * 3 + 2] = pt.z;

            heartOriginals.push({ x: pt.x, y: pt.y, z: pt.z, speed: Math.random() * 0.02 + 0.01 });

            // Color gradient blend
            const mixedColor = colorPink.clone().lerp(
                Math.random() > 0.5 ? colorPurple : colorCyan,
                Math.random() * 0.7
            );

            heartColors[i * 3] = mixedColor.r;
            heartColors[i * 3 + 1] = mixedColor.g;
            heartColors[i * 3 + 2] = mixedColor.b;
        }

        heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
        heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

        const heartMaterial = new THREE.PointsMaterial({
            size: 3.2,
            vertexColors: true,
            map: particleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const heartPoints = new THREE.Points(heartGeometry, heartMaterial);
        scene.add(heartPoints);

        // Swirling Base Orbital Ring Particles (Y-plane ring under heart)
        const RING_PARTICLE_COUNT = 1800;
        const ringGeometry = new THREE.BufferGeometry();
        const ringPositions = new Float32Array(RING_PARTICLE_COUNT * 3);
        const ringColors = new Float32Array(RING_PARTICLE_COUNT * 3);
        const ringData = [];

        for (let i = 0; i < RING_PARTICLE_COUNT; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 45 + Math.random() * 40;
            const yOffset = -55 + (Math.random() - 0.5) * 8;

            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            ringPositions[i * 3] = x;
            ringPositions[i * 3 + 1] = yOffset;
            ringPositions[i * 3 + 2] = z;

            ringData.push({
                angle: angle,
                radius: radius,
                y: yOffset,
                speed: (Math.random() * 0.015 + 0.005) * (Math.random() > 0.5 ? 1 : -1)
            });

            const col = colorCyan.clone().lerp(colorPink, Math.random());
            ringColors[i * 3] = col.r;
            ringColors[i * 3 + 1] = col.g;
            ringColors[i * 3 + 2] = col.b;
        }

        ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
        ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

        const ringMaterial = new THREE.PointsMaterial({
            size: 2.5,
            vertexColors: true,
            map: particleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const ringPoints = new THREE.Points(ringGeometry, ringMaterial);
        scene.add(ringPoints);

        // Background Galaxy Starfield
        const STAR_COUNT = 1200;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(STAR_COUNT * 3);

        for (let i = 0; i < STAR_COUNT; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 800;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 800;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 800;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({
            size: 1.5,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6
        });

        const starPoints = new THREE.Points(starGeometry, starMaterial);
        scene.add(starPoints);

        // Mouse Rotation Tilt
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            mouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
            targetRotationY = mouseX * 0.5;
            targetRotationX = mouseY * 0.3;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = (e.touches[0].clientX - window.innerWidth / 2) / (window.innerWidth / 2);
                mouseY = (e.touches[0].clientY - window.innerHeight / 2) / (window.innerHeight / 2);
                targetRotationY = mouseX * 0.5;
                targetRotationX = mouseY * 0.3;
            }
        }, { passive: true });

        // Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            overlayCanvas.width = window.innerWidth;
            overlayCanvas.height = window.innerHeight;
        });


        // 3. OVERLAY CANVAS FOR FLOATING HEARTS & FIREWORKS
        const overlayCanvas = document.getElementById('overlay-canvas');
        const ctx = overlayCanvas.getContext('2d');
        overlayCanvas.width = window.innerWidth;
        overlayCanvas.height = window.innerHeight;

        const floatingHearts = [];
        const fireworks = [];

        class FloatingHeart {
            constructor() {
                this.x = Math.random() * overlayCanvas.width;
                this.y = overlayCanvas.height + 20;
                this.size = Math.random() * 14 + 10;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.8;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.color = `hsl(${Math.random() * 60 + 320}, 100%, 75%)`;
            }

            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.02) * 0.5;
                this.opacity -= 0.003;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = this.color;
                ctx.font = `${this.size}px sans-serif`;
                ctx.fillText('❤️', this.x, this.y);
                ctx.restore();
            }
        }

        class FireworkParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.12;
                this.opacity = 1;
                this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.opacity -= 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            for (let i = 0; i < 80; i++) {
                fireworks.push(new FireworkParticle(x, y));
            }
        }

        // Periodically spawn floating hearts
        setInterval(() => {
            if (floatingHearts.length < 25) {
                floatingHearts.push(new FloatingHeart());
            }
        }, 600);


        // 4. ANIMATION LOOP (60 FPS)
        let clock = new THREE.Clock();
        let isHeartExploded = false;

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotate Starfield slowly
            starPoints.rotation.y = elapsedTime * 0.02;

            // Smooth rotation towards mouse position
            heartPoints.rotation.y += (targetRotationY - heartPoints.rotation.y) * 0.05;
            heartPoints.rotation.x += (-targetRotationX - heartPoints.rotation.x) * 0.05;
            
            // Auto base rotation
            heartPoints.rotation.y += 0.005;

            // Heart pulse beating scale animation
            const pulse = 1 + Math.sin(elapsedTime * 3) * 0.05 + Math.pow(Math.sin(elapsedTime * 6), 4) * 0.03;
            if (!isHeartExploded) {
                heartPoints.scale.set(pulse, pulse, pulse);
            } else {
                // Expanded glow state on acceptance
                heartPoints.scale.lerp(new THREE.Vector3(1.4, 1.4, 1.4), 0.05);
            }

            // Animate Ring Particles
            const ringPos = ringGeometry.attributes.position.array;
            for (let i = 0; i < RING_PARTICLE_COUNT; i++) {
                ringData[i].angle += ringData[i].speed;
                ringPos[i * 3] = Math.cos(ringData[i].angle) * ringData[i].radius;
                ringPos[i * 3 + 2] = Math.sin(ringData[i].angle) * ringData[i].radius;
            }
            ringGeometry.attributes.position.needsUpdate = true;
            ringPoints.rotation.y += 0.002;

            // Render 3D Scene
            renderer.render(scene, camera);

            // Render 2D Overlay (Floating Hearts & Fireworks)
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            for (let i = floatingHearts.length - 1; i >= 0; i--) {
                floatingHearts[i].update();
                floatingHearts[i].draw();
                if (floatingHearts[i].opacity <= 0 || floatingHearts[i].y < -20) {
                    floatingHearts.splice(i, 1);
                }
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].opacity <= 0) {
                    fireworks.splice(i, 1);
                }
            }
        }

        animate();


        // 5. TYPEWRITER SEQUENCE SYSTEM
        const typewriterLines = [
            "Xin chào <span class='highlight-name'>Hân Trương</span> ❤️",
            "Có lẽ đây không phải lời tỏ tình hoàn hảo nhất...",
            "...nhưng là tất cả những gì trái tim anh muốn nói.",
            "<span class='highlight-name'>Hân Trương</span>, em có đồng ý làm người yêu anh không? ❤️"
        ];

        const typewriterTextEl = document.getElementById('typewriterText');
        const buttonsGroup = document.getElementById('buttonsGroup');

        let currentLineIndex = 0;

        function typeLine(htmlContent, onComplete) {
            typewriterTextEl.innerHTML = "";
            
            // Parse HTML tags so formatting appears smoothly
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            
            // Build typewriter sequence token by token
            let charIndex = 0;
            const rawText = tempDiv.innerHTML;
            
            // Typing interval loop
            let timer = setInterval(() => {
                // If tag is encountered, append complete tag
                if (rawText[charIndex] === '<') {
                    const closingAngle = rawText.indexOf('>', charIndex);
                    if (closingAngle !== -1) {
                        charIndex = closingAngle + 1;
                    }
                } else {
                    charIndex++;
                }

                typewriterTextEl.innerHTML = rawText.substring(0, charIndex) + `<span class="cursor"></span>`;

                if (charIndex >= rawText.length) {
                    clearInterval(timer);
                    typewriterTextEl.innerHTML = rawText; // Final clean state
                    if (onComplete) setTimeout(onComplete, 1400);
                }
            }, 60);
        }

        function startTypewriterSequence() {
            if (currentLineIndex < typewriterLines.length) {
                typeLine(typewriterLines[currentLineIndex], () => {
                    currentLineIndex++;
                    if (currentLineIndex < typewriterLines.length) {
                        startTypewriterSequence();
                    } else {
                        // Reveal interactive buttons on final question
                        buttonsGroup.classList.add('show');
                    }
                });
            }
        }

        // Start sequence on page load
        window.addEventListener('load', () => {
            setTimeout(startTypewriterSequence, 800);
        });


        // 6. RUNAWAY "ĐỂ EM SUY NGHĨ" BUTTON LOGIC
        const btnNo = document.getElementById('btnNo');

        function moveRunawayButton(e) {
            const btnRect = btnNo.getBoundingClientRect();
            const mouseX = e.clientX || (e.touches && e.touches[0].clientX);
            const mouseY = e.clientY || (e.touches && e.touches[0].clientY);

            if (!mouseX || !mouseY) return;

            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            const distance = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

            // Trigger runaway when pointer approaches within 120px
            if (distance < 120) {
                const maxOffsetX = window.innerWidth / 2 - 100;
                const maxOffsetY = window.innerHeight / 2 - 100;

                const randomX = (Math.random() - 0.5) * maxOffsetX * 1.5;
                const randomY = (Math.random() - 0.5) * maxOffsetY * 1.5;

                btnNo.style.position = 'fixed';
                btnNo.style.left = `${Math.min(Math.max(40, window.innerWidth / 2 + randomX), window.innerWidth - 160)}px`;
                btnNo.style.top = `${Math.min(Math.max(40, window.innerHeight / 2 + randomY), window.innerHeight - 80)}px`;
            }
        }

        window.addEventListener('mousemove', moveRunawayButton);
        window.addEventListener('touchmove', moveRunawayButton);
        btnNo.addEventListener('mouseenter', moveRunawayButton);


        // 7. CONFESSION ACCEPTANCE ("ĐỒNG Ý") CELEBRATION
        const btnYes = document.getElementById('btnYes');
        const typewriterContainer = document.getElementById('typewriterContainer');
        const successBox = document.getElementById('successBox');
        const flashScreen = document.getElementById('flash-screen');

        btnYes.addEventListener('click', () => {
            // A. Screen Flash Glow Effect (2 seconds)
            flashScreen.style.opacity = '1';
            setTimeout(() => {
                flashScreen.style.opacity = '0';
            }, 2000);

            // B. Transform 3D Heart Glow
            isHeartExploded = true;
            heartMaterial.size = 4.8;

            // C. Hide dialogue controls & reveal victory message
            typewriterContainer.style.display = 'none';
            buttonsGroup.style.display = 'none';
            successBox.style.display = 'flex';

            // D. Launch Multiple Fireworks
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 3;

            createFirework(centerX, centerY);
            createFirework(centerX - 150, centerY + 50);
            createFirework(centerX + 150, centerY + 50);

            let fireworkInterval = setInterval(() => {
                const randomX = Math.random() * window.innerWidth;
                const randomY = Math.random() * (window.innerHeight / 2);
                createFirework(randomX, randomY);
            }, 400);

            setTimeout(() => clearInterval(fireworkInterval), 5000);

            // E. Trigger Confetti Explosion
            if (typeof confetti === 'function') {
                const duration = 4 * 1000;
                const end = Date.now() + duration;

                (function frame() {
                    confetti({
                        particleCount: 7,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: ['#f472b6', '#38bdf8', '#8b5cf6', '#ffffff']
                    });
                    confetti({
                        particleCount: 7,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: ['#f472b6', '#38bdf8', '#8b5cf6', '#ffffff']
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
            }
        });
    </script>
</body>
</html>
